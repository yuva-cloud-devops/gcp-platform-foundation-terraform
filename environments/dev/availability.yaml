project_id: yuvaraj-internal-project
region: asia-south1
state_bucket: gcp-remote-backend-tfstate-management-bucket

tags:
  provisioned_by: terraform
  environment: dev
  project: gcp-platform-foundation-terraform

availability:
  # ---------------------------------------------------------------------------
  # Global External Application Load Balancer (HTTP/S)
  # Routes Public Traffic (Port 80) -> Multi-Region MIG Backends (Port 8080)
  # ---------------------------------------------------------------------------
  load_balancer:
    name: glb-web
    create_address: true
    http_forward: true
    ssl: false
    https_redirect: false

    backend:
      description: "Global Multi-Region HTTP Backend Service (Mumbai & Singapore)"
      protocol: HTTP
      port: 8080
      port_name: http
      timeout_sec: 30
      enable_cdn: false
      connection_draining_timeout_sec: 30
      session_affinity: NONE
      balancing_mode: UTILIZATION
      max_utilization: 0.8
      capacity_scaler: 1.0

      # Regional MIGs from 3-compute-infrastructure
      target_migs:
        - mig-web-mumbai
        - mig-web-singapore

      # Global Load Balancer Health Check
      health_check:
        request_path: /
        port: 8080
        check_interval_sec: 10
        timeout_sec: 5
        healthy_threshold: 2
        unhealthy_threshold: 3
        logging: true

      # Backend Traffic Logging
      log_config:
        enable: true
        sample_rate: 1.0