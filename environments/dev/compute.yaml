project_id: yuvaraj-internal-project
region: asia-south1
state_bucket: gcp-remote-backend-tfstate-management-bucket


tags:
  provisioned_by: terraform
  environment: dev
  project: gcp-platform-foundation-terraform


compute:
  # ---------------------------------------------------------------------------
  # 1. Common Instance Template Configuration (Defined Once)
  # ---------------------------------------------------------------------------
  instance_template:
    name_prefix: mig-web-tpl
    machine_type: e2-medium
    disk_size_gb: 10
    disk_type: pd-balanced
    auto_delete: true
    enable_shielded_vm: true
    nic_type: GVNIC
    service_account_name: sa-mig-workload

    # Packer Golden Image Details
    source_image_project: yuvaraj-internal-project
    source_image_family: mig-test-app
    source_image: mig-test-app-1794287654

    tags:
      - allow-health-check
      - allow-iap-ssh
      - allow-web

  # ---------------------------------------------------------------------------
  # 2. Regional Managed Instance Groups (Mumbai & Singapore)
  # ---------------------------------------------------------------------------
  migs:
    - name: mig-web-mumbai
      region: asia-south1
      subnet_name: private-subnet-mumbai

      named_ports:
        - name: http
          port: 8080

      autoscaling:
        enabled: true
        min_replicas: 2
        max_replicas: 5
        cooldown_period: 60
        cpu_target: 0.65

      health_check:
        type: http
        port: 8080
        request_path: /
        check_interval_sec: 10
        healthy_threshold: 2
        unhealthy_threshold: 3
        timeout_sec: 5
        initial_delay_sec: 30
        enable_logging: true

      update_policy:
        type: PROACTIVE
        minimal_action: REPLACE
        replacement_method: SUBSTITUTE
        max_surge_fixed: 3
        max_unavailable_fixed: 0
        min_ready_sec: 30

    - name: mig-web-singapore
      region: asia-southeast1
      subnet_name: private-subnet-singapore

      named_ports:
        - name: http
          port: 8080

      autoscaling:
        enabled: true
        min_replicas: 2
        max_replicas: 5
        cooldown_period: 60
        cpu_target: 0.65

      health_check:
        type: http
        port: 8080
        request_path: /
        check_interval_sec: 10
        healthy_threshold: 2
        unhealthy_threshold: 3
        timeout_sec: 5
        initial_delay_sec: 30
        enable_logging: true

      update_policy:
        type: PROACTIVE
        minimal_action: REPLACE
        replacement_method: SUBSTITUTE
        max_surge_fixed: 3
        max_unavailable_fixed: 0
        min_ready_sec: 30