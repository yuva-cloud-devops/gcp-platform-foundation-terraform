project_id: yuvaraj-internal-project
region: asia-south1
gcs_location: ASIA-SOUTH1

# -----------------------------------------------------------------------------
# Google Cloud APIs to Enable
# -----------------------------------------------------------------------------
apis:
  # Core & CI/CD
  - cloudbuild.googleapis.com
  - storage.googleapis.com
  - cloudresourcemanager.googleapis.com
  - iam.googleapis.com
  - logging.googleapis.com
  - serviceusage.googleapis.com

  # Networking & Connectivity
  - compute.googleapis.com
  - networkmanagement.googleapis.com
  - servicenetworking.googleapis.com

  # Security & Availability (Cloud Armor & Load Balancing)
  - iap.googleapis.com
  - secretmanager.googleapis.com

# -----------------------------------------------------------------------------
# GCS Storage Buckets Configuration
# -----------------------------------------------------------------------------
buckets:
  state_bucket:
    name: gcp-remote-backend-tfstate-management-bucket
    force_destroy: false
    versioning: true
    uniform_bucket_level_access: true

  plan_bucket:
    name: gcp-tfplans-instancetemplate-strorage-bucket
    force_destroy: true
    versioning: false
    uniform_bucket_level_access: true
    lifecycle_days: 14

# -----------------------------------------------------------------------------
# Dedicated Cloud Build Service Account & IAM Roles
# -----------------------------------------------------------------------------
service_account:
  name: sa-cloudbuild-terraform
  display_name: "Terraform Cloud Build Executor SA"
  description: "Dedicated service account for running Terraform CI/CD pipelines"
  
  roles:
    # Storage Access
    - roles/storage.objectAdmin

    # Pipeline & Logging
    - roles/logging.logWriter

    # 1-Network Infrastructure (VPC, Subnets, Routers, NATs, Firewall)
    - roles/compute.networkAdmin

    # 2-Compute Infrastructure (VMs, Disks, Instance Groups)
    - roles/compute.instanceAdmin.v1
    - roles/iam.serviceAccountUser

    # 3-Security & Cloud Armor (Security Policies, Firewall Admin)
    - roles/compute.securityAdmin

    # 4-Availability & Load Balancing (Backend Services, URL Maps, Health Checks)
    - roles/compute.loadBalancerAdmin

    # Inspection
    - roles/viewer


# -----------------------------------------------------------------------------
# Cloud Build Repositories & Dynamic Triggers
# -----------------------------------------------------------------------------
cloudbuild:
  repositories:
    github_repo:
      name: gcp-platform-foundation-terraform
      parent_connection: projects/yuvaraj-internal-project/locations/asia-south1/connections/github-connection
      remote_uri: "https://github.com/yuva-cloud-devops/gcp-platform-foundation-terraform.git"

  triggers:
    # 1. CI Trigger: Runs on Pull Requests
    ci_pr_trigger:
      name: terraform-platform-ci
      description: "Automated Terraform PR validation & planning"
      filename: "cloudbuild-pipelines/terraform-ci.yaml"
      repository_key: "github_repo"
      pull_request:
        branch: "^main$"
        comment_control: "COMMENTS_ENABLED_FOR_EXTERNAL_CONTRIBUTORS_ONLY"
      substitutions:
        _PR_NUMBER: "$(pull_request.number)"
        _REPO_OWNER: "yuva-cloud-devops"

    # 2. CD Trigger: Runs on Push/Merge to main
    cd_push_trigger:
      name: terraform-platform-cd
      description: "Automated Terraform apply on merge to main"
      filename: "cloudbuild-pipelines/terraform-cd.yaml"
      repository_key: "github_repo"
      push:
        branch: "^main$"
      substitutions:
        _AUTO_APPROVE: "true"


secrets:
  - "github-pr-token"