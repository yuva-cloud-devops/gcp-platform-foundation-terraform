# ==============================================================================
# Cloud Build Continuous Deployment (CD) Pipeline for Terraform
# Trigger: Push / Merge to 'main'
# Architectural Sequence: Network -> Security -> Compute -> Availability
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Detect Scope from Merged PR (Ordered: Network -> Security -> Compute -> Availability)
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'detect-scope-from-pr'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq git curl
        chmod +x cloudbuild-pipelines/scripts/*.sh
        ./cloudbuild-pipelines/scripts/detect-cd-scope.sh \
          "deployment_scope.json" \
          "${_REPO_OWNER}" \
          "${_REPO_NAME}"

  # ----------------------------------------------------------------------------
  # Step 2: Validate Target YAML Configurations against JSON Schemas
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'validate-configs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq python3-yaml python3-jsonschema
        chmod +x cloudbuild-pipelines/scripts/*.sh
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)
        
        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          CONFIG_PATH=$$(jq -r ".targets[$$i].config" deployment_scope.json)
          SCHEMA_PATH=$$(jq -r ".targets[$$i].schema" deployment_scope.json)
          ./cloudbuild-pipelines/scripts/validate-config.sh "$$CONFIG_PATH" "$$SCHEMA_PATH"
        done

  # ----------------------------------------------------------------------------
  # Step 3: Sequential Terraform Apply (Fail-Fast: Halts Immediately on Any Error)
  # ----------------------------------------------------------------------------
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-apply-sequential'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e  # Stops immediately if any layer fails, preventing next layers from starting
        apk add --no-cache jq bash

        ENV=$$(jq -r '.environment' deployment_scope.json)
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)

        echo "=========================================================="
        echo "🚀 Starting Deployment for Environment: $$ENV ($$TARGET_COUNT layer(s))"
        echo "=========================================================="

        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          DIR=$$(jq -r ".targets[$$i].dir" deployment_scope.json)
          NAME=$$(jq -r ".targets[$$i].name" deployment_scope.json)
          
          echo ""
          echo "----------------------------------------------------------"
          echo "📦 STEP [$$((i + 1))/$$TARGET_COUNT]: Applying $$NAME ($$DIR)"
          echo "----------------------------------------------------------"

          # 1. Initialize State in GCS: gs://<state-bucket>/<env>/<infra>/default.tfstate
          echo "1️⃣ Initializing Terraform remote state prefix: $${ENV}/$${NAME}..."
          
          echo "bucket = \"${_STATE_BUCKET}\"" > "$$DIR/$${NAME}-$${ENV}-backend.hcl"
          echo "prefix = \"$$ENV/$$NAME\"" >> "$$DIR/$${NAME}-$${ENV}-backend.hcl"

          echo "📄 Generated $$DIR/$${NAME}-$${ENV}-backend.hcl:"
          cat "$$DIR/$${NAME}-$${ENV}-backend.hcl"

          terraform -chdir="$$DIR" init -backend-config="$${NAME}-$${ENV}-backend.hcl" -input=false

          # 2. Apply Infrastructure Changes to GCP
          echo "2️⃣ Applying Changes to GCP ($$ENV)..."
          terraform -chdir="$$DIR" apply \
            -var="environment=$$ENV" \
            -auto-approve \
            -input=false

          echo "✅ Layer '$$NAME' applied successfully!"
          echo "3️⃣ Exporting Layer '$$NAME' outputs for CD Audit Bot..."
          terraform -chdir="$$DIR" output -json > "$$DIR/outputs.json" || true
        done

        echo ""
        echo "=========================================================="
        echo "🎉 All $$TARGET_COUNT layer(s) successfully deployed to '$$ENV'!"
        echo "=========================================================="

  # ----------------------------------------------------------------------------
  # Step 4: Record Deployment Audit Trail in Cloud Logging
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'deployment-audit-log'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq
        ENV=$$(jq -r '.environment' deployment_scope.json)
        PR_NUM=$$(jq -r '.pr_number // "N/A"' deployment_scope.json)
        TARGETS=$$(jq -r '[.targets[].name] | join(" -> ")' deployment_scope.json)

        echo "=========================================================="
        echo "📋 DEPLOYMENT AUDIT LOG"
        echo "Status       : SUCCESS"
        echo "Environment  : $$ENV"
        echo "Merged PR    : #$$PR_NUM"
        echo "Applied Path : $$TARGETS"
        echo "Commit SHA   : ${SHORT_SHA}"
        echo "Build ID     : $BUILD_ID"
        echo "Applied At   : $$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        echo "=========================================================="
  
  # ----------------------------------------------------------------------------
  # Step 5: Post Deployment Audit Log to Merged PR via GitHub App Bot
  # ----------------------------------------------------------------------------
  - name: 'node:20-alpine'
    id: 'post-cd-audit-comment'
    entrypoint: 'node'
    secretEnv: ['GITHUB_APP_PRIVATE_KEY']
    env:
      - 'GITHUB_APP_ID=${_GITHUB_APP_ID}'
      - 'REPO_OWNER=${_REPO_OWNER}'
      - 'REPO_NAME=${_REPO_NAME}'
      - 'SHORT_SHA=${SHORT_SHA}'
      - 'BUILD_ID=${BUILD_ID}'
      - 'STATE_BUCKET=${_STATE_BUCKET}'
      - 'DEPLOYMENT_SCOPE=deployment_scope.json'
    args:
      - 'cloudbuild-pipelines/scripts/cd-bot.js'


# Only Single Secret Needed
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-app-private-key/versions/latest
      env: 'GITHUB_APP_PRIVATE_KEY'


# Substitutions defaults
substitutions:
  _STATE_BUCKET: 'gcp-remote-backend-tfstate-management-bucket'
  _REPO_OWNER: 'yuva-cloud-devops'
  _REPO_NAME: 'gcp-platform-foundation-terraform'
  _GITHUB_APP_ID: '5622633' # <-- Put your GitHub App ID here

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'