# ==============================================================================
# Cloud Build Continuous Deployment (CD) Pipeline for Terraform
# Trigger: Push / Merge to 'main'
# Architectural Sequence: Network -> Security -> Compute -> Availability
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Detect Scope from Merged PR via GitHub App API
  # (Ordered: Network -> Security -> Compute -> Availability)
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'detect-scope-from-pr'
    entrypoint: 'bash'
    secretEnv: ['GITHUB_APP_PRIVATE_KEY']
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq git curl openssl
        chmod +x cloudbuild-pipelines/scripts/*.sh

        echo "-------------------------------------------------------------------------------------------------------"
        echo "🔑 Minting GitHub App JWT to detect merged PR for commit ${COMMIT_SHA}..."

        NOW=$$(date +%s)
        IAT=$$((NOW - 60))
        EXP=$$((NOW + 540))

        HEADER=$$(echo -n '{"alg":"RS256","typ":"JWT"}' | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
        PAYLOAD=$$(echo -n "{\"iat\":$$IAT,\"exp\":$$EXP,\"iss\":\"${_GITHUB_APP_ID}\"}" | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')

        echo "$$GITHUB_APP_PRIVATE_KEY" > /tmp/app_key.pem
        SIGNATURE=$$(echo -n "$${HEADER}.$${PAYLOAD}" | openssl dgst -sha256 -sign /tmp/app_key.pem | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
        rm -f /tmp/app_key.pem
        JWT="$${HEADER}.$${PAYLOAD}.$${SIGNATURE}"

        INSTALL_ID=$$(curl -s -H "Authorization: Bearer $$JWT" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${_REPO_OWNER}/${_REPO_NAME}/installation" | jq -r '.id // empty')

        if [ -z "$$INSTALL_ID" ]; then
          echo "❌ Error: Could not obtain GitHub App Installation ID."
          exit 1
        fi

        INSTALL_TOKEN=$$(curl -s -X POST -H "Authorization: Bearer $$JWT" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/app/installations/$$INSTALL_ID/access_tokens" | jq -r '.token // empty')

        echo "🔍 Looking up Merged PR associated with commit ${COMMIT_SHA}..."
        PR_JSON=$$(curl -s -H "Authorization: token $$INSTALL_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${_REPO_OWNER}/${_REPO_NAME}/commits/${COMMIT_SHA}/pulls")

        PR_NUMBER=$$(echo "$$PR_JSON" | jq -r '.[0].number // empty')
        echo "$$PR_JSON" | jq -r '.[0].body // empty' > pr_body.txt

        # Fallback: If commit lookup returns empty, fetch the most recently merged PR on main
        if [ -z "$$PR_NUMBER" ] || [ ! -s pr_body.txt ]; then
          echo "ℹ️ Commit PR lookup empty; checking latest merged PR on main..."
          CLOSED_PRS=$$(curl -s -H "Authorization: token $$INSTALL_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${_REPO_OWNER}/${_REPO_NAME}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=5")
          PR_NUMBER=$$(echo "$$CLOSED_PRS" | jq -r '[.[] | select(.merged_at != null)][0].number // empty')
          echo "$$CLOSED_PRS" | jq -r '[.[] | select(.merged_at != null)][0].body // empty' > pr_body.txt
        fi

        echo "✅ Detected Merged PR: #$${PR_NUMBER:-N/A}"
        echo "-------------------------------------------------------------------------------------------------------"
        echo "📄 Merged PR Deployment Request Content:"
        cat pr_body.txt
        echo ""
        echo "-------------------------------------------------------------------------------------------------------"

        ./cloudbuild-pipelines/scripts/validate-request.sh pr_body.txt

        # Inject pr_number and action="apply" into deployment_scope.json
        jq --arg pr "$${PR_NUMBER:-N/A}" '. + {pr_number: $pr, action: "apply"}' deployment_scope.json > deployment_scope.tmp
        mv deployment_scope.tmp deployment_scope.json

        echo "📋 Final CD deployment_scope.json:"
        cat deployment_scope.json
        echo "-------------------------------------------------------------------------------------------------------"

  # ----------------------------------------------------------------------------
  # Step 2: Validate Target YAML Configurations against JSON Schemas
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'validate-configs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq python3-yaml python3-jsonschema
        chmod +x cloudbuild-pipelines/scripts/*.sh
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)
        
        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          CONFIG_PATH=$$(jq -r ".targets[$$i].config" deployment_scope.json)
          SCHEMA_PATH=$$(jq -r ".targets[$$i].schema" deployment_scope.json)
          ./cloudbuild-pipelines/scripts/validate-config.sh "$$CONFIG_PATH" "$$SCHEMA_PATH"
        done

  # ----------------------------------------------------------------------------
  # Step 3: Sequential Terraform Apply (Fail-Fast: Halts Immediately on Any Error)
  # ----------------------------------------------------------------------------
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-apply-sequential'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e  # Stops immediately if any layer fails, preventing next layers from starting
        apk add --no-cache jq bash

        ENV=$$(jq -r '.environment' deployment_scope.json)
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)

        echo "=========================================================="
        echo "🚀 Starting Deployment for Environment: $$ENV ($$TARGET_COUNT layer(s))"
        echo "=========================================================="

        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          DIR=$$(jq -r ".targets[$$i].dir" deployment_scope.json)
          NAME=$$(jq -r ".targets[$$i].name" deployment_scope.json)
          
          echo ""
          echo "----------------------------------------------------------"
          echo "📦 STEP [$$((i + 1))/$$TARGET_COUNT]: Applying $$NAME ($$DIR)"
          echo "----------------------------------------------------------"

          # 1. Initialize State in GCS: gs://<state-bucket>/<env>/<infra>/default.tfstate
          echo "1️⃣ Initializing Terraform remote state prefix: $${ENV}/$${NAME}..."
          
          echo "bucket = \"${_STATE_BUCKET}\"" > "$$DIR/$${NAME}-$${ENV}-backend.hcl"
          echo "prefix = \"$$ENV/$$NAME\"" >> "$$DIR/$${NAME}-$${ENV}-backend.hcl"

          echo "📄 Generated $$DIR/$${NAME}-$${ENV}-backend.hcl:"
          cat "$$DIR/$${NAME}-$${ENV}-backend.hcl"

          terraform -chdir="$$DIR" init -backend-config="$${NAME}-$${ENV}-backend.hcl" -input=false

          # 2. Apply Infrastructure Changes to GCP
          echo "2️⃣ Applying Changes to GCP ($$ENV)..."
          terraform -chdir="$$DIR" apply \
            -var="environment=$$ENV" \
            -auto-approve \
            -input=false

          echo "✅ Layer '$$NAME' applied successfully!"
          echo "3️⃣ Exporting Layer '$$NAME' outputs for CD Audit Bot..."
          terraform -chdir="$$DIR" output -json > "$$DIR/outputs.json" || true
        done

        echo ""
        echo "=========================================================="
        echo "🎉 All $$TARGET_COUNT layer(s) successfully deployed to '$$ENV'!"
        echo "=========================================================="

  # ----------------------------------------------------------------------------
  # Step 4: Record Deployment Audit Trail in Cloud Logging
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'deployment-audit-log'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq
        ENV=$$(jq -r '.environment' deployment_scope.json)
        PR_NUM=$$(jq -r '.pr_number // "N/A"' deployment_scope.json)
        TARGETS=$$(jq -r '[.targets[].name] | join(" -> ")' deployment_scope.json)

        echo "=========================================================="
        echo "📋 DEPLOYMENT AUDIT LOG"
        echo "Status       : SUCCESS"
        echo "Environment  : $$ENV"
        echo "Merged PR    : #$$PR_NUM"
        echo "Applied Path : $$TARGETS"
        echo "Commit SHA   : ${SHORT_SHA}"
        echo "Build ID     : $BUILD_ID"
        echo "Applied At   : $$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        echo "=========================================================="
  
  # ----------------------------------------------------------------------------
  # Step 5: Post Deployment Audit Log to Merged PR via GitHub App Bot
  # ----------------------------------------------------------------------------
  - name: 'node:20-alpine'
    id: 'post-cd-audit-comment'
    entrypoint: 'node'
    secretEnv: ['GITHUB_APP_PRIVATE_KEY']
    env:
      - 'GITHUB_APP_ID=${_GITHUB_APP_ID}'
      - 'REPO_OWNER=${_REPO_OWNER}'
      - 'REPO_NAME=${_REPO_NAME}'
      - 'SHORT_SHA=${SHORT_SHA}'
      - 'BUILD_ID=${BUILD_ID}'
      - 'STATE_BUCKET=${_STATE_BUCKET}'
      - 'DEPLOYMENT_SCOPE=deployment_scope.json'
    args:
      - 'cloudbuild-pipelines/scripts/cd-bot.js'


# Only Single Secret Needed
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-app-private-key/versions/latest
      env: 'GITHUB_APP_PRIVATE_KEY'


# Substitutions defaults
substitutions:
  _STATE_BUCKET: 'gcp-remote-backend-tfstate-management-bucket'
  _REPO_OWNER: 'yuva-cloud-devops'
  _REPO_NAME: 'gcp-platform-foundation-terraform'
  _GITHUB_APP_ID: '5622633'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'