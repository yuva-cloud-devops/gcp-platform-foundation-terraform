# ==============================================================================
# Pipeline 1: Terraform PR Validation Pipeline (CI)
# Features: YAML Validation, Gitleaks, Trivy, Checkov, TF Plan & Secret Manager PR Commenting
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Parse PR Scope & Generate deployment_scope.json
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'parse-pr-scope'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq curl git
        chmod +x cloudbuild-pipelines/scripts/*.sh
        
        echo "-------------------------------------------------------------------------------------------------------"
        echo "🔍 Fetching PR #${_PR_NUMBER} details from GitHub API..."
        
        PR_API_URL="https://api.github.com/repos/${_REPO_OWNER}/${_REPO_NAME}/pulls/${_PR_NUMBER}"
        curl -s -H "Accept: application/vnd.github.v3+json" "$$PR_API_URL" | jq -r '.body // ""' > pr_body.txt
        
        if [ ! -s pr_body.txt ] || [ "$$(cat pr_body.txt)" = "null" ] || [ "$$(cat pr_body.txt)" = "" ]; then
          echo "⚠️ Note: Could not fetch PR body or empty. Using default scope."
          echo "deployment_request:" > pr_body.txt
          echo "  infrastructure:" >> pr_body.txt
          echo "    - network" >> pr_body.txt
          echo "  environment: dev" >> pr_body.txt
        fi
        
        echo "-------------------------------------------------------------------------------------------------------"
        echo "📄 PR Deployment Request Content:"
        cat pr_body.txt
        echo ""
        
        echo "-------------------------------------------------------------------------------------------------------"
        ./cloudbuild-pipelines/scripts/validate-request.sh pr_body.txt
        echo "-------------------------------------------------------------------------------------------------------"



  # ----------------------------------------------------------------------------
  # Step 2: Validate Target YAML Configurations
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'validate-configs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "-------------------------------------------------------------------------------------------------------"
        apt-get update && apt-get install -y jq python3-yaml python3-jsonschema
        chmod +x cloudbuild-pipelines/scripts/*.sh
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)
        
        echo "-------------------------------------------------------------------------------------------------------"
        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          CONFIG_PATH=$$(jq -r ".targets[$$i].config" deployment_scope.json)
          SCHEMA_PATH=$$(jq -r ".targets[$$i].schema" deployment_scope.json)
          ./cloudbuild-pipelines/scripts/validate-config.sh "$$CONFIG_PATH" "$$SCHEMA_PATH"
          echo "...................................................................................................."
        done
        echo "-------------------------------------------------------------------------------------------------------"


  # ----------------------------------------------------------------------------
  # Step 3: Secret Detection (Gitleaks)
  # ----------------------------------------------------------------------------
  - name: 'zricethezav/gitleaks:latest'
    id: 'secret-scan-gitleaks'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "-------------------------------------------------------------------------------------------------------"
        gitleaks detect --source=. --verbose --redact 2>&1 | tee gitleaks_report.txt || true
        echo "-------------------------------------------------------------------------------------------------------"


  # ----------------------------------------------------------------------------
  # Step 4: Vulnerability & Misconfiguration Scan (Trivy)
  # ----------------------------------------------------------------------------
  - name: 'aquasec/trivy:latest'
    id: 'vuln-scan-trivy'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "-------------------------------------------------------------------------------------------------------"
        trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --no-progress . 2>&1 | tee trivy_report.txt || true
        echo "-------------------------------------------------------------------------------------------------------"


  # ----------------------------------------------------------------------------
  # Step 5: Terraform Format Check, Init & Validate
  # ----------------------------------------------------------------------------
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-validate'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache jq bash
        ENV=$$(jq -r '.environment' deployment_scope.json)
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)

        echo "-------------------------------------------------------------------------------------------------------"
        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          DIR=$$(jq -r ".targets[$$i].dir" deployment_scope.json)
          NAME=$$(jq -r ".targets[$$i].name" deployment_scope.json)
          
          echo "====================================================================================="
          echo "🚀 Validating: $$NAME in $$DIR (Env: $$ENV)"
          echo "====================================================================================="
          
          echo "1. Format Check..."
          terraform -chdir="$$DIR" fmt -check
          echo "....................................................................................."

          echo "2. Initializing remote state prefix: $${ENV}/$${NAME}..."
          
          echo "bucket = \"${_STATE_BUCKET}\"" > "$$DIR/$${NAME}-$${ENV}-backend.hcl"
          echo "prefix = \"$$ENV/$$NAME\"" >> "$$DIR/$${NAME}-$${ENV}-backend.hcl"

          echo "📄 Generated $$DIR/$${NAME}-$${ENV}-backend.hcl:"
          cat "$$DIR/$${NAME}-$${ENV}-backend.hcl"

          terraform -chdir="$$DIR" init -backend-config="$${NAME}-$${ENV}-backend.hcl" -input=false
          echo "....................................................................................."

          echo "3. Validating Terraform code..."
          terraform -chdir="$$DIR" validate
          echo "....................................................................................."
        done
        echo "-------------------------------------------------------------------------------------------------------"


  # ----------------------------------------------------------------------------
  # Step 6: IaC Compliance & Security Scan (Checkov)
  # ----------------------------------------------------------------------------
  - name: 'bridgecrew/checkov:latest'
    id: 'iac-scan-checkov'
    entrypoint: 'python3'
    args:
      - '-c'
      - |
        import json, subprocess, os
        if os.path.exists('deployment_scope.json'):
            with open('deployment_scope.json') as f:
                targets = json.load(f).get('targets', [])
            
            with open('checkov_report.txt', 'w') as out:
                for t in targets:
                    target_dir = t['dir']
                    print("\n----------------------------------------------------------------------------------------\n")
                    print("🛡️ Scanning " + str(target_dir) + " with Checkov...")
                    cmd = ['checkov', '-d', target_dir, '--framework', 'terraform', '--soft-fail-on', 'LOW,MEDIUM']
                    res = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                    out.write(res.stdout)
                    print("Checkov finished scanning " + str(target_dir))
                print("\n----------------------------------------------------------------------------------------\n")
            print("\n==================================== CHECKOV REPORT ====================================\n")
            with open('checkov_report.txt', 'r') as report:
                print(report.read())
            print("\n==================================== END OF REPORT =====================================\n")


  # ----------------------------------------------------------------------------
  # Step 7: Terraform Plan Generation & Human-Readable Output
  # ----------------------------------------------------------------------------
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-plan'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache jq bash
        ENV=$$(jq -r '.environment' deployment_scope.json)
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)
        
        echo "-------------------------------------------------------------------------------------------------------"
        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          DIR=$$(jq -r ".targets[$$i].dir" deployment_scope.json)
          NAME=$$(jq -r ".targets[$$i].name" deployment_scope.json)
         
          echo "....................................................................................."
          echo "=========================================================="
          echo "📋 Planning: $$NAME in $$DIR (Env: $$ENV)"
          echo "=========================================================="

          echo "📄 Generated $$DIR/$${NAME}-$${ENV}-backend.hcl:"
          cat "$$DIR/$${NAME}-$${ENV}-backend.hcl"

          terraform -chdir="$$DIR" init -backend-config="$${NAME}-$${ENV}-backend.hcl" -input=false
          terraform -chdir="$$DIR" plan -var="environment=$$ENV" -out="tfplan.binary" -input=false

          echo "....................................................................................."
          
          echo "📄 Rendering human-readable plan in JSON Format for PR review..."
          terraform -chdir="$$DIR" show -json tfplan.binary > "$$DIR/tfplan.json"
          echo "....................................................................................."
        done
        echo "-------------------------------------------------------------------------------------------------------"


  # ----------------------------------------------------------------------------
  # Step 8: Store Approved tfPlan.json in GCS Plan Bucket
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'upload-plan-to-gcs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq
        ENV=$$(jq -r '.environment' deployment_scope.json)
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)

        echo "-------------------------------------------------------------------------------------------------------"
        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          DIR=$$(jq -r ".targets[$$i].dir" deployment_scope.json)
          NAME=$$(jq -r ".targets[$$i].name" deployment_scope.json)
          
          if [ -f "$$DIR/tfplan.json" ]; then
            echo "....................................................................................."
            DEST="gs://${_PLAN_BUCKET}/tf-plan-review/${_PR_NUMBER}/${SHORT_SHA}/$${NAME}-$${ENV}-tfplan.json"
            echo "📦 Uploading tf plan json to: $$DEST"
            gsutil cp "$$DIR/tfplan.json" "$$DEST"
            echo "....................................................................................."
          fi
        done
        echo "-------------------------------------------------------------------------------------------------------"

  # ----------------------------------------------------------------------------
  # Step 9: Post Formatted Plan Review Report to GitHub PR (Via GitHub App Bot)
  # ----------------------------------------------------------------------------
  - name: 'node:20-alpine'
    id: 'post-pr-comment-bot'
    entrypoint: 'node'
    secretEnv: ['GITHUB_APP_PRIVATE_KEY']
    env:
      - 'GITHUB_APP_ID=${_GITHUB_APP_ID}'
      - 'PR_NUMBER=${_PR_NUMBER}'
      - 'REPO_OWNER=${_REPO_OWNER}'
      - 'REPO_NAME=${_REPO_NAME}'
      - 'SHORT_SHA=${SHORT_SHA}'
      - 'DEPLOYMENT_SCOPE=deployment_scope.json'
    args:
      - 'cloudbuild-pipelines/scripts/bot.js'


# Injects the GitHub App Private Key securely from Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-app-private-key/versions/latest
      env: 'GITHUB_APP_PRIVATE_KEY'

substitutions:
  _REPO_OWNER: 'yuva-cloud-devops'
  _REPO_NAME: 'gcp-platform-foundation-terraform'
  _PR_NUMBER: '1'
  _STATE_BUCKET: 'gcp-remote-backend-tfstate-management-bucket'
  _PLAN_BUCKET: 'gcp-tfplans-instancetemplate-strorage-bucket'
  _GITHUB_APP_ID: '5622633' # <-- Put your GitHub App ID here

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
