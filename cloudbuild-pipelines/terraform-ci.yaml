# ==============================================================================
# Pipeline 1: Terraform PR Validation Pipeline (CI)
# Features: YAML Validation, Gitleaks, Trivy, Checkov, TF Plan & Secret Manager PR Commenting
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Parse PR Scope & Generate deployment_scope.json
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'parse-pr-scope'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq curl git
        chmod +x cloudbuild-pipelines/scripts/*.sh
        
        echo "🔍 Fetching PR #${_PR_NUMBER} details from GitHub API..."
        
        PR_API_URL="https://api.github.com/repos/${_REPO_OWNER}/${_REPO_NAME}/pulls/${_PR_NUMBER}"
        curl -s -H "Accept: application/vnd.github.v3+json" "$$PR_API_URL" | jq -r '.body // ""' > pr_body.txt
        
        if [ ! -s pr_body.txt ] || [ "$$(cat pr_body.txt)" = "null" ] || [ "$$(cat pr_body.txt)" = "" ]; then
          echo "⚠️ Note: Could not fetch PR body or empty. Using default scope."
          echo "deployment_request:" > pr_body.txt
          echo "  infrastructure:" >> pr_body.txt
          echo "    - network" >> pr_body.txt
          echo "  environment: dev" >> pr_body.txt
        fi
        
        echo "📄 PR Deployment Request Content:"
        cat pr_body.txt
        echo ""
        
        ./cloudbuild-pipelines/scripts/validate-request.sh pr_body.txt

  # ----------------------------------------------------------------------------
  # Step 2: Validate Target YAML Configurations
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'validate-configs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq
        chmod +x cloudbuild-pipelines/scripts/*.sh
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)
        
        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          CONFIG_PATH=$$(jq -r ".targets[$$i].config" deployment_scope.json)
          ./cloudbuild-pipelines/scripts/validate-config.sh "$$CONFIG_PATH"
        done

  # ----------------------------------------------------------------------------
  # Step 3: Secret Detection (Gitleaks)
  # ----------------------------------------------------------------------------
  - name: 'zricethezav/gitleaks:latest'
    id: 'secret-scan-gitleaks'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        gitleaks detect --source=. --verbose --redact | tee gitleaks_report.txt || true

  # ----------------------------------------------------------------------------
  # Step 4: Vulnerability & Misconfiguration Scan (Trivy)
  # ----------------------------------------------------------------------------
  - name: 'aquasec/trivy:latest'
    id: 'vuln-scan-trivy'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL . | tee trivy_report.txt || true

  # ----------------------------------------------------------------------------
  # Step 5: Terraform Format Check, Init & Validate
  # ----------------------------------------------------------------------------
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-validate'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache jq bash
        ENV=$$(jq -r '.environment' deployment_scope.json)
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)

        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          DIR=$$(jq -r ".targets[$$i].dir" deployment_scope.json)
          NAME=$$(jq -r ".targets[$$i].name" deployment_scope.json)
          
          echo "=========================================================="
          echo "🚀 Validating: $$NAME in $$DIR (Env: $$ENV)"
          echo "=========================================================="
          
          echo "1. Format Check..."
          terraform -chdir="$$DIR" fmt -check
          
          echo "2. Initializing remote state prefix: remote-state-management/$${ENV}/$${NAME}..."
          terraform -chdir="$$DIR" init \
            -backend-config="bucket=${_STATE_BUCKET}" \
            -backend-config="prefix=remote-state-management/$${ENV}/$${NAME}"
          
          echo "3. Validating Terraform code..."
          terraform -chdir="$$DIR" validate
        done

  # ----------------------------------------------------------------------------
  # Step 6: IaC Compliance & Security Scan (Checkov)
  # ----------------------------------------------------------------------------
  - name: 'bridgecrew/checkov:latest'
    id: 'iac-scan-checkov'
    entrypoint: 'python3'
    args:
      - '-c'
      - |
        import json, subprocess, os
        if os.path.exists('deployment_scope.json'):
            with open('deployment_scope.json') as f:
                targets = json.load(f).get('targets', [])
            
            with open('checkov_report.txt', 'w') as out:
                for t in targets:
                    target_dir = t['dir']
                    print("🛡️ Scanning " + str(target_dir) + " with Checkov...")
                    cmd = ['checkov', '-d', target_dir, '--framework', 'terraform', '--soft-fail-on', 'LOW,MEDIUM']
                    res = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                    out.write(res.stdout)
                    print("Checkov finished scanning " + str(target_dir))

  # ----------------------------------------------------------------------------
  # Step 7: Terraform Plan Generation & Human-Readable Output
  # ----------------------------------------------------------------------------
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-plan'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache jq bash
        ENV=$$(jq -r '.environment' deployment_scope.json)
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)

        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          DIR=$$(jq -r ".targets[$$i].dir" deployment_scope.json)
          NAME=$$(jq -r ".targets[$$i].name" deployment_scope.json)
          
          echo "📝 Generating binary plan for $$NAME..."
          terraform -chdir="$$DIR" plan -var="environment=$$ENV" -out="tfplan.binary" -no-color
          
          echo "📄 Rendering human-readable plan for PR review..."
          terraform -chdir="$$DIR" show -no-color tfplan.binary > "$$DIR/plan_readable.txt"
        done

  # ----------------------------------------------------------------------------
  # Step 8: Store Approved Binary Plan in GCS Plan Bucket
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'upload-plan-to-gcs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq
        ENV=$$(jq -r '.environment' deployment_scope.json)
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)

        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          DIR=$$(jq -r ".targets[$$i].dir" deployment_scope.json)
          NAME=$$(jq -r ".targets[$$i].name" deployment_scope.json)
          
          if [ -f "$$DIR/tfplan.binary" ]; then
            DEST="gs://${_PLAN_BUCKET}/tf-plan-review/${_PR_NUMBER}/${SHORT_SHA}/$${NAME}-$${ENV}.tfplan"
            echo "📦 Uploading binary plan to: $$DEST"
            gsutil cp "$$DIR/tfplan.binary" "$$DEST"
          fi
        done

  # ----------------------------------------------------------------------------
  # Step 9: Post Formatted Plan Review Report to GitHub PR (Via Secret Manager)
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'post-pr-comment'
    entrypoint: 'bash'
    secretEnv: ['GITHUB_PAT']
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq curl
        chmod +x cloudbuild-pipelines/scripts/*.sh
        ./cloudbuild-pipelines/scripts/post-pr-comment.sh \
          "${_PR_NUMBER}" \
          "${_REPO_OWNER}" \
          "${_REPO_NAME}" \
          "$$GITHUB_PAT" \
          "deployment_scope.json"

# Injects the secret securely without exposing it in plaintext substitutions
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-pr-token/versions/latest
      env: 'GITHUB_PAT'

substitutions:
  _REPO_OWNER: 'yuva-cloud-devops'
  _REPO_NAME: 'gcp-platform-foundation-terraform'
  _PR_NUMBER: '1'
  _STATE_BUCKET: 'gcp-remote-backend-tfstate-management-bucket'
  _PLAN_BUCKET: 'gcp-tfplans-instancetemplate-strorage-bucket'

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
