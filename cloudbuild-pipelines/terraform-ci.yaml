# ==============================================================================
# Pipeline 1: Terraform PR Validation Pipeline (CI)
# Trigger: Pull Request against main
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Parse PR Scope & Generate deployment_scope.json
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'parse-pr-scope'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq curl git
        chmod +x cloudbuild-pipelines/scripts/*.sh
        
        echo "🔍 Fetching PR #${_PR_NUMBER} details from GitHub API..."
        
        PR_API_URL="https://api.github.com/repos/${_REPO_OWNER}/${_REPO_NAME}/pulls/${_PR_NUMBER}"
        curl -s -H "Accept: application/vnd.github.v3+json" "$$PR_API_URL" | jq -r '.body // ""' > pr_body.txt
        
        if [ ! -s pr_body.txt ] || [ "$$(cat pr_body.txt)" = "null" ] || [ "$$(cat pr_body.txt)" = "" ]; then
          echo "⚠️ Note: Could not fetch PR body or empty. Using default scope."
          cat <<EOF > pr_body.txt
        deployment_request:
          infrastructure:
            - network
          environment: dev
        EOF
        fi
        
        echo "📄 PR Deployment Request Content:"
        cat pr_body.txt
        echo ""
        
        ./cloudbuild-pipelines/scripts/validate-request.sh pr_body.txt

  # ----------------------------------------------------------------------------
  # Step 2: Validate Target YAML Configurations
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'validate-configs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq
        chmod +x cloudbuild-pipelines/scripts/*.sh
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)
        
        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          CONFIG_PATH=$$(jq -r ".targets[$$i].config" deployment_scope.json)
          ./cloudbuild-pipelines/scripts/validate-config.sh "$$CONFIG_PATH"
        done

  # ----------------------------------------------------------------------------
  # Step 3: Terraform Format Check, Init & Validate
  # ----------------------------------------------------------------------------
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-validate'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache jq bash
        ENV=$$(jq -r '.environment' deployment_scope.json)
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)

        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          DIR=$$(jq -r ".targets[$$i].dir" deployment_scope.json)
          NAME=$$(jq -r ".targets[$$i].name" deployment_scope.json)
          
          echo "=========================================================="
          echo "🚀 Validating: $$NAME in $$DIR (Env: $$ENV)"
          echo "=========================================================="
          
          echo "1. Format Check..."
          terraform -chdir="$$DIR" fmt -check
          
          echo "2. Initializing remote state prefix: remote-state-management/$${ENV}/$${NAME}..."
          terraform -chdir="$$DIR" init \
            -backend-config="bucket=${_STATE_BUCKET}" \
            -backend-config="prefix=remote-state-management/$${ENV}/$${NAME}"
          
          echo "3. Validating Terraform code..."
          terraform -chdir="$$DIR" validate
        done

  # ----------------------------------------------------------------------------
  # Step 4: Security Scan (Checkov)
  # ----------------------------------------------------------------------------
  - name: 'bridgecrew/checkov:latest'
    id: 'security-scan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install jq
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)

        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          DIR=$$(jq -r ".targets[$$i].dir" deployment_scope.json)
          echo "🛡️ Scanning $$DIR with Checkov..."
          checkov -d "$$DIR" --framework terraform --soft-fail-on LOW,MEDIUM || true
        done

  # ----------------------------------------------------------------------------
  # Step 5: Terraform Plan Generation
  # ----------------------------------------------------------------------------
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-plan'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache jq bash
        ENV=$$(jq -r '.environment' deployment_scope.json)
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)

        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          DIR=$$(jq -r ".targets[$$i].dir" deployment_scope.json)
          NAME=$$(jq -r ".targets[$$i].name" deployment_scope.json)
          
          echo "📝 Generating binary plan for $$NAME..."
          terraform -chdir="$$DIR" plan -var="environment=$$ENV" -out="tfplan.binary" -no-color
        done

  # ----------------------------------------------------------------------------
  # Step 6: Store Approved Binary Plan in GCS Plan Bucket
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'upload-plan-to-gcs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y jq
        ENV=$$(jq -r '.environment' deployment_scope.json)
        TARGET_COUNT=$$(jq '.targets | length' deployment_scope.json)

        for i in $$(seq 0 $$((TARGET_COUNT - 1))); do
          DIR=$$(jq -r ".targets[$$i].dir" deployment_scope.json)
          NAME=$$(jq -r ".targets[$$i].name" deployment_scope.json)
          
          if [ -f "$$DIR/tfplan.binary" ]; then
            DEST="gs://${_PLAN_BUCKET}/tf-plan-review/${_PR_NUMBER}/${SHORT_SHA}/$${NAME}-$${ENV}.tfplan"
            echo "📦 Uploading binary plan to: $$DEST"
            gsutil cp "$$DIR/tfplan.binary" "$$DEST"
          fi
        done

substitutions:
  _REPO_OWNER: 'yuva-cloud-devops'
  _REPO_NAME: 'gcp-platform-foundation-terraform'
  _STATE_BUCKET: 'yuvaraj-internal-project-terraform-state'
  _PLAN_BUCKET: 'yuvaraj-internal-project-terraform-plans'

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true